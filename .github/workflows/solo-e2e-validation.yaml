name: "ZXC: Solo E2E Validation"

on:
  workflow_dispatch:
    inputs:
      custom-job-label:
        description: "Custom Job Label"
        type: string
        required: false
        default: "Solo E2E Validation"
      solo-ref:
        description: "Solo ref to validate against (tag, branch, or commit SHA)"
        type: string
        required: false
        # TODO(5172): revert to "" (main) once the Solo side is merged. Until then the chart-layout
        # suite and the chart parity test only exist on this branch, so validating against main
        # would silently skip both and leave the consensus-node chart untested.
        default: "5172-migrate-from-the-solo-chartssolo-deployment-helm-chart-to-a-new-chart-that-represents-a-single-consensus-node-solo-chartsconsensus-node"
  workflow_call:
    inputs:
      custom-job-label:
        description: "Custom Job Label"
        type: string
        required: false
        default: "Solo E2E Validation"
      solo-ref:
        description: "Solo ref to validate against (tag, branch, or commit SHA)"
        type: string
        required: false
        # TODO(5172): revert to "" (main) once the Solo side is merged. Until then the chart-layout
        # suite and the chart parity test only exist on this branch, so validating against main
        # would silently skip both and leave the consensus-node chart untested.
        default: "5172-migrate-from-the-solo-chartssolo-deployment-helm-chart-to-a-new-chart-that-represents-a-single-consensus-node-solo-chartsconsensus-node"

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: write
  checks: write
  statuses: write

jobs:
  test:
    name: ${{ inputs.custom-job-label || 'Solo E2E Validation' }}
    runs-on: hl-solo-chart-lin-md

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.39.2
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout solo-charts PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get changed files related to charts/workflows
        id: changed-files
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          files_yaml: |
            chart:
              - charts/**
              - .github/workflows/**

      - name: Decide whether to run validation
        id: check-changed-files
        run: |
          if [[ "${{ steps.changed-files.outputs.chart_any_changed }}" == "true" ]]; then
            echo "run-tests=true" >> "${GITHUB_OUTPUT}"
            echo "Executing Solo E2E validation..."
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run-tests=true" >> "${GITHUB_OUTPUT}"
            echo "Executing Solo E2E validation due to workflow dispatch"
          else
            echo "No relevant chart/workflow files changed; skipping Solo E2E validation"
          fi

      - name: Checkout Solo
        if: ${{ steps.check-changed-files.outputs.run-tests == 'true' && !failure() && !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hiero-ledger/solo
          ref: ${{ inputs.solo-ref || 'main' }}
          path: solo
          fetch-depth: 1

      - name: Setup Node
        if: ${{ steps.check-changed-files.outputs.run-tests == 'true' && !failure() && !cancelled() }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.0.4
        with:
          node-version: 23
          cache: npm
          cache-dependency-path: solo/package-lock.json

      - name: Setup Helm
        if: ${{ steps.check-changed-files.outputs.run-tests == 'true' && !failure() && !cancelled() }}
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.2

      - name: Install Kubectl
        if: ${{ steps.check-changed-files.outputs.run-tests == 'true' && !failure() && !cancelled() }}
        uses: step-security/setup-kubectl@fdd30c5ae990e05271b3bde363e8b9cdeb1eb400 # v5.2.0
        with:
          version: v1.32.2

      - name: Setup Kind
        if: ${{ steps.check-changed-files.outputs.run-tests == 'true' && !failure() && !cancelled() }}
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
          version: v0.29.0
          kubectl_version: v1.32.2

      # A fresh checkout has no charts/*/charts directory, and `--chart-dir` makes Helm render the
      # chart straight from the working tree rather than from a packaged release, so the subchart
      # dependencies have to be resolved here. The release pipeline does the same before packaging.
      - name: Resolve chart dependencies
        if: ${{ steps.check-changed-files.outputs.run-tests == 'true' && !failure() && !cancelled() }}
        run: |
          for chart in charts/*/; do
            if grep -q '^dependencies:' "${chart}Chart.yaml"; then
              helm dependency update "${chart}"
            fi
          done

      - name: Install Solo dependencies
        if: ${{ steps.check-changed-files.outputs.run-tests == 'true' && !failure() && !cancelled() }}
        working-directory: solo
        run: npm ci

      # Pure `helm template` comparison, no cluster: catches a consensus-node chart that has drifted
      # from the umbrella chart's per-node templates before anything is deployed. Skips itself on a
      # Solo ref that predates the test.
      - name: Check consensus-node chart parity against the umbrella chart
        if: ${{ steps.check-changed-files.outputs.run-tests == 'true' && !failure() && !cancelled() }}
        working-directory: solo
        env:
          SOLO_CHARTS_DIR: ${{ github.workspace }}/charts
        run: |
          if [[ ! -f test/e2e/integration/core/consensus-node-chart-parity.test.ts ]]; then
            echo "::notice::Solo ref '${{ inputs.solo-ref || 'main' }}' has no chart parity test; skipping"
            exit 0
          fi
          npx mocha 'test/e2e/integration/core/consensus-node-chart-parity.test.ts'

      - name: Run Solo test setup against this solo-charts checkout
        if: ${{ steps.check-changed-files.outputs.run-tests == 'true' && !failure() && !cancelled() }}
        working-directory: solo
        env:
          SOLO_CHARTS_DIR: ${{ github.workspace }}/charts
        shell: bash
        run: |
          task test-setup

      - name: Add Solo-installed tools to PATH
        if: ${{ steps.check-changed-files.outputs.run-tests == 'true' && !failure() && !cancelled() }}
        run: |
          echo "$HOME/.solo/bin" >> "$GITHUB_PATH"

      - name: Run Solo minimal one-shot E2E against this solo-charts checkout
        if: ${{ steps.check-changed-files.outputs.run-tests == 'true' && !failure() && !cancelled() }}
        working-directory: solo
        env:
          SOLO_CHARTS_DIR: ${{ github.workspace }}/charts
          SOLO_ONE_SHOT_MINIMAL_SETUP: "true"
        run: |
          task test-e2e-one-shot-single-minimal

      # Unlike the one-shot suite above, this one passes `--chart-dir`, so it is the step that
      # actually exercises the charts in this checkout. It lives in Solo, so it only exists on a
      # Solo ref that carries it; `solo-ref` selects that branch until the Solo side is merged.
      - name: Run consensus chart layout E2E against this solo-charts checkout
        id: consensus-chart-layout
        if: ${{ steps.check-changed-files.outputs.run-tests == 'true' && !failure() && !cancelled() }}
        working-directory: solo
        env:
          SOLO_CHARTS_DIR: ${{ github.workspace }}/charts
        run: |
          if ! task --list-all | grep -q 'test-e2e-consensus-chart-layout'; then
            echo "::notice::Solo ref '${{ inputs.solo-ref || 'main' }}' has no test-e2e-consensus-chart-layout task; skipping"
            exit 0
          fi
          task test-e2e-consensus-chart-layout